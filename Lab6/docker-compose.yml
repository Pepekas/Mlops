version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stress_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d stress_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "9005:8005"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/stress_db
    depends_on:
      db:
        condition: service_healthy